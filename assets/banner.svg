<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" role="img" aria-label="Ian profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f778ba"/>
      <stop offset="0.2" stop-color="#ffa657"/>
      <stop offset="0.4" stop-color="#e3b341"/>
      <stop offset="0.6" stop-color="#56d364"/>
      <stop offset="0.8" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="160" fill="url(#bg)"/>

  <text x="64" y="80" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#e6edf3">Hi, I'm <tspan fill="#56d364">Ian</tspan></text>
  <text x="66" y="112" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#8b949e">iaanne · data science @ uns'24 · surakarta</text>

  <rect x="0" y="150" width="1000" height="10" fill="url(#rainbow)"/>
</svg>
