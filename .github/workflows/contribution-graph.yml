name: generate arcade contribution graphs

on:
  schedule: # Berjalan otomatis tiap 24 jam
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa dijalankan manual
  push: # Jalan tiap kali push ke main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: iaanne  # Username GitHub kamu
          # games: 'galaga'  # ← Ganti dengan 'galaga'
          games: 'galaga'  # Tentukan game yang mau digenerate
          # hide_month_labels: 'false'  # Opsional: true kalo mau hilangin label bulan

      # Push hasil generate ke branch output
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
